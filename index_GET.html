<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="form-container">
        <h2>Formulario de Registro</h2>
        <form id="FormularioRegistro" action="#" method="GET">
            
            <!-- Nombres -->
            <div class="form-group">
                <label for="nombres">Nombres:</label>
                
                <input type="text" id="nombres" name="nombres" placeholder="Ingresa tus nombres" required>
            </div>

            <!-- Apellidos -->
            <div class="form-group">
                <label for="apellidos">Apellidos:</label>
                <input type="text" id="apellidos" name="apellidos" placeholder="Ingresa tus apellidos" required>
            </div>

            <!-- Tipo de identificación (Códigos DIAN) -->
            <div class="form-group">
                <label for="tipo-id">Tipo de documento:</label>
                <select id="tipo-id" name="tipo-id" required>
                    <option value="" disabled selected>Seleccione una opción</option>
                    <option value="13">Cédula de ciudadanía</option>
                    <option value="12">Tarjeta de identidad</option>   
                    <option value="41">Pasaporte</option>
                    <option value="22">Cédula de extranjería</option>
                </select>
            </div>

            <!-- País de domicilio (Códigos DIAN / Excepción Colombia) -->
            <div class="form-group">
                <label for="pais">País de domicilio:</label>
                <select id="pais" name="pais" required>
                    <option value="" disabled selected>Seleccione un país</option>
                    <option value="169">Colombia</option>
                    <option value="840">Estados Unidos</option>
                    <option value="724">España</option>
                </select>
            </div>

            <!-- Ciudad de domicilio (Mínimo 5 ciudades / Códigos DIAN) -->
            <div class="form-group">
                <label for="ciudad">Ciudad de domicilio:</label>
                <select id="ciudad" name="ciudad" required>
                    <option value="" disabled selected>Seleccione una ciudad</option>
                    <option value="11001">Bogotá, D.C.</option>
                    <option value="05001">Medellín</option>
                    <option value="76001">Cali</option>
                    <option value="08001">Barranquilla</option>
                    <option value="13001">Cartagena</option>
                </select>
            </div>

            <!-- Número de teléfono -->
            <div class="form-group">
                <label for="telefono">Número de teléfono:</label>
                <input type="tel" id="telefono" name="telefono" pattern="[0-9]{10}" placeholder="Ej: 3191234567" required>
            </div>

            <!-- Correo -->
            <div class="form-group">
                <label for="correo">Correo electrónico:</label>
                <input type="email" id="correo" name="correo" placeholder="ejemplo@correo.com" required>
            </div>

            <!-- Check de tratamiento de datos -->
            <div class="terms-group">
                <input type="checkbox" id="terminos" name="terminos" required>
                <label for="terminos" class="terms-label">
                    Acepto los términos y condiciones
                    <br>
                    <a href="https://www.funcionpublica.gov.co/eva/gestornormativo/norma.php?i=49981" target="_blank" rel="noopener noreferrer">Tratamiento de datos</a>
                </label>
            </div>

            <!-- Botón de enviar -->
            <button type="submit" class="btn-submit">Enviar formulario</button>
        </form>
    </div>

</body>
</html>
